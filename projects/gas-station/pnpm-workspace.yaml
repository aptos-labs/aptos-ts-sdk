# 48 hours; matches Aikido Safe Chain's default minimum package age.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@aptos-labs/*"
  - baseline-browser-mapping
  - caniuse-lite

allowBuilds:
  esbuild: true

overrides:
  minimatch@^9: ^9.0.9
  qs@^6: ^6.15.3
  glob@^10: ^10.5.0
  rollup@^4: ^4.62.4
  picomatch@^4: ^4.0.5
  path-to-regexp@^8: ^8.4.2
  form-data: ^4.0.6
  body-parser: ^2.3.0
