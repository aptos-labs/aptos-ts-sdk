packages:
  - "packages/*"

# pnpm 12 otherwise prepends an environment document to pnpm-lock.yaml that
# GitHub's dependency graph currently reads as an empty project graph.
pmOnFail: ignore

autoInstallPeers: true
strictPeerDependencies: false

# 48 hours; matches Aikido Safe Chain's default minimum package age.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@aptos-labs/*"
  - baseline-browser-mapping
  - caniuse-lite

allowBuilds:
  esbuild: true

overrides:
  shell-quote@^1: ^1.12.0
  ws@^8: ^8.21.3
  linkify-it: ^5.0.2
  brace-expansion@^5: ^5.0.12
  markdown-it: ^14.3.1
  js-yaml@^4: ^4.3.2
  immutable: ^5.1.9
  postcss: ^8.5.28
  nanoid@^3: ^3.3.18
  esbuild: ^0.28.2
  "@babel/core": ^7.29.7
  "@aptos-labs/aptos-client": ^4.1.0
  glob@^10: ^10.5.0
  # glob 14 / minimatch 11 / @graphql-tools/utils 12 / zod 4 are the first
  # patched majors for their advisories; no patched release exists in the
  # ranges requested by the (transitive) dependents.
  glob@^13: ^14.0.2
  minimatch@^9: ^9.0.9
  minimatch@^10: ^11.0.1
  node-forge: ^1.4.3
  "@graphql-tools/utils": ^12.0.2
  zod@^3: ^4.6.6
  file-type: 21.3.4
  yauzl: 3.4.0
  uuid: ^14.0.2
  "@xmldom/xmldom": ^0.8.15
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.7
  brace-expansion@^1: ^1.1.18
  brace-expansion@^2: ^2.1.4
  js-yaml@^3: ^3.15.2
  undici@^7: ^7.29.1
  # Metro (via expo / confidential-asset-bindings) still depends on image-size@^1,
  # which is archived at 1.2.1 and vulnerable to CVE-2025-71329 / CVE-2025-71330.
  # Force the 1.x-compatible drop-in that contains the infinite-loop DoS fixes.
  image-size: npm:image-size-next@1.2.2
