packages:
  - "packages/*"

autoInstallPeers: true
strictPeerDependencies: false

# 48 hours; matches Aikido Safe Chain's default minimum package age.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@aptos-labs/*"
  - baseline-browser-mapping
  - caniuse-lite

allowBuilds:
  esbuild: true

overrides:
  shell-quote@^1: ^1.10.0
  ws@^8: ^8.21.3
  linkify-it: ^5.0.2
  brace-expansion@^5: 5.0.9
  markdown-it: ^14.3.1
  js-yaml@^4: ^4.3.2
  immutable: ^5.1.9
  postcss: ^8.5.28
  nanoid@^3: ^3.3.18
  esbuild: ^0.28.2
  "@babel/core": ^7.29.7
  "@aptos-labs/aptos-client": ^4.1.0
  glob@^10: ^10.5.0
  minimatch@^9: ^9.0.9
  file-type: 21.3.4
  yauzl: 3.4.0
  uuid: ^14.0.2
  "@xmldom/xmldom": ^0.8.15
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.7
  brace-expansion@^1: ^1.1.18
  brace-expansion@^2: ^2.1.4
  js-yaml@^3: ^3.15.2
  undici@^7: ^7.29.1
  # Metro (via expo / confidential-asset-bindings) still depends on image-size@^1,
  # which is archived at 1.2.1 and vulnerable to CVE-2025-71329 / CVE-2025-71330.
  # Force the 1.x-compatible drop-in that contains the infinite-loop DoS fixes.
  image-size: npm:image-size-next@1.2.2
