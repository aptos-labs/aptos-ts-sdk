autoInstallPeers: true
strictPeerDependencies: false

# 48 hours; matches Aikido Safe Chain's default minimum package age.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@aptos-labs/*"
  - baseline-browser-mapping
  - caniuse-lite

allowBuilds:
  esbuild: true

overrides:
  form-data@^4: ^4.0.6
  picomatch@^4: ^4.0.7
  qs@^6: ^6.16.0
  shell-quote@^1: ^1.10.0
