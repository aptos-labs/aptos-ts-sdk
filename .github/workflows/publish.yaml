name: "Publish to NPM"
on:
  release:
    types: [published]

# Deny-all default; each job opts into only the scopes it needs.
permissions: {}

# Serialize publishes for the same release tag so two runs can't race on the
# same version; never cancel an in-flight publish (killing it mid-push is worse
# than letting it finish). Different package tags still publish independently.
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-pack:
    name: Build & pack release tarball
    runs-on: 4cpu-gh-ubuntu24-x64
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Resolve package, verify tag & main ancestry
        id: resolve
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == ts-sdk-v* ]]; then
            dir="packages/ts-sdk"
            pkg="@aptos-labs/ts-sdk"
            version="${TAG#ts-sdk-v}"
          elif [[ "$TAG" == confidential-asset-v* ]]; then
            dir="packages/confidential-asset"
            pkg="@aptos-labs/confidential-asset"
            version="${TAG#confidential-asset-v}"
          else
            echo "Tag '$TAG' is not a package release tag; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Release tag '$TAG' ($(git rev-parse HEAD)) is not an ancestor of origin/main."
            exit 1
          fi

          pkg_version="$(node -p "require('./${dir}/package.json').version")"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "::error::Tag version ($version) != ${dir}/package.json version ($pkg_version)"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.resolve.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build, verify license, and pack tarball
        if: steps.resolve.outputs.publish == 'true'
        env:
          PKG_NAME: ${{ steps.resolve.outputs.pkg }}
          PKG_DIR: ${{ steps.resolve.outputs.dir }}
        run: |
          set -euo pipefail
          pnpm --filter "${PKG_NAME}..." build
          pnpm --dir "${PKG_DIR}" run check-license
          mkdir -p "${RUNNER_TEMP}/pack"
          pnpm --dir "${PKG_DIR}" pack --pack-destination "${RUNNER_TEMP}/pack"
          ls -la "${RUNNER_TEMP}/pack"

      - name: Upload packed tarball
        if: steps.resolve.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-pack
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage package on NPM
    needs: build-and-pack
    if: needs.build-and-pack.outputs.publish == 'true'
    runs-on: 4cpu-gh-ubuntu24-x64
    environment: npm-publish
    permissions:
      id-token: write # OIDC trusted publishing + provenance
      contents: read
    steps:
      - name: Download packed tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-pack
          path: ./pack

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.21.0"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires a one-time Trusted Publisher config on
      # npmjs.com for each package (repo aptos-labs/aptos-ts-sdk, workflow
      # publish.yaml, environment npm-publish). See CONTRIBUTING.md. No NPM_TOKEN
      # secret is used. Staged packages require maintainer approval with 2FA
      # before becoming public (`pnpm stage approve`).
      - name: Stage tarball on NPM (OIDC trusted publishing)
        env:
          DIST_TAG: ${{ needs.build-and-pack.outputs.dist_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 tarball in ./pack, found ${#tarballs[@]}"
            exit 1
          fi
          pnpm stage publish "${tarballs[0]}" \
            --provenance \
            --access public \
            --tag "${DIST_TAG}" \
            --no-git-checks
