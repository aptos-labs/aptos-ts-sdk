name: "Run optimized SDK build"
description: |
    Run build for Browser, Node, and Types

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # Install once at the repository root.
    - run: pnpm install --frozen-lockfile
      shell: bash

    # Build the SDK, check its package metadata, and verify tree-shaking.
    - run: |
        pnpm turbo run build --filter=@aptos-labs/ts-sdk
        pnpm turbo run check-license --filter=@aptos-labs/ts-sdk
        pnpm turbo run test:tree-shaking --filter=@aptos-labs/ts-sdk
      shell: bash
