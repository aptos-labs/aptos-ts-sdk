name: "Verify SDK formatting"
description: |
  Run Biome formatter on the codebase to ensure consistency

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # Install once at the repository root, then check every workspace package.
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm _fmt
      shell: bash
