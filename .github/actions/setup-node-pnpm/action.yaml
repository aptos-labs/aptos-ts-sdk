name: "Setup Node, pnpm, and safe-chain"
description: |
  Install Node (from .node-version), pnpm, and safe-chain. Run this before
  any pnpm install step.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pin@v6.5.0
      with:
        node-version-file: .node-version
        registry-url: "https://registry.npmjs.org"

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

    - name: Add local package binaries to PATH
      run: echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"
      shell: bash

    - name: Allow first-party @aptos-labs/* packages and fast-updating deps through safe-chain age check
      shell: bash
      run: echo "SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS=@aptos-labs/* baseline-browser-mapping caniuse-lite" >> "${GITHUB_ENV}"

    - name: Setup AikidoSec Safe Chain
      uses: aptos-labs/actions/aikidosec-safe-chain@fdd3a3a628c840d5c35086a87e9cc3141b635505 # pin@main
