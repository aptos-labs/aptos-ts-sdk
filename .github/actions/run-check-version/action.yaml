name: "Check SDK versions match"
description: |
  Run check-version to ensure versions match when the target branch is main

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # Install once at the repository root, then check the TS SDK version.
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm turbo run check-version --filter=@aptos-labs/ts-sdk
      shell: bash
