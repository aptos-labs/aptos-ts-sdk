name: "Lint SDK Code"
description: |
  Run Biome linter on the codebase to ensure consistency

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # Install once at the repository root, then lint every workspace package.
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm turbo run lint
      shell: bash
